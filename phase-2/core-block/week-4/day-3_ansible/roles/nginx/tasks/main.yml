- name: update cache apt and install Nginx and OpenSSL
  apt:
    name:
      - nginx
      - openssl
    state: present
    update_cache: yes

- name: Create folder for SSL certificate
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

- name: Create self-signed certificate with OpenSSL
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout /etc/nginx/ssl/nginx.key
    -out /etc/nginx/ssl/nginx.crt
    -subj "/C=VN/ST=Hanoi/L=Hanoi/O=JITS/CN={{ nginx_server_name }}"
  args:
    creates: /etc/nginx/ssl/nginx.crt

- name: Configure nginx.conf file from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Restart Nginx

- name: Ensure Nginx service is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes
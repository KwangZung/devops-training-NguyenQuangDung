apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: kserve-lab
data:
  nginx.conf: |
    events {}
    http {
        upstream v1 { server iris-model-v1-predictor.kserve-lab.svc.cluster.local; }
        upstream v2 { server iris-model-v2-predictor.kserve-lab.svc.cluster.local; }
        
        split_clients "${remote_addr}${remote_port}${msec}" $backend_upstream {
            90%     v1;
            *       v2;
        }
        
        map $backend_upstream $rewritten_uri {
            v1      /v1/models/iris-model-v1:predict;
            v2      /v1/models/iris-model-v2:predict;
        }
        
        server {
            listen 80;
            location /v1/models/iris-model:predict {
                rewrite ^ $rewritten_uri break;
                proxy_pass http://$backend_upstream;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kserve-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kserve-lab
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80

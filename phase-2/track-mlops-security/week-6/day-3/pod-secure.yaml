apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: ns-restricted
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: alpine
    image: alpine
    command: ["sleep", "9999"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL